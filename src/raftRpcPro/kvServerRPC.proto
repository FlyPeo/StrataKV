syntax = "proto3";


package raftKVRpcProctoc; //所在的命名空间

option cc_generic_services = true;  //开启stub服务

// 日志实体
message GetArgs{
  bytes Key = 1 ;
  bytes ClientId = 2 ;
  int32 RequestId = 3;
}


message GetReply  {
  //	下面几个参数和论文中相同
  bytes Err = 1;
  bytes Value = 2;

}

message ListArgs {
  bytes Prefix = 1;
  uint32 Limit = 2;
  // Operator-only inspection flag. This permits a read from a local follower
  // so an administrator can compare the physical replicas of one Region.
  bool AllowFollowerRead = 3;
}

message KeyValue {
  bytes Key = 1;
  bytes Value = 2;
}

message ListReply {
  bytes Err = 1;
  repeated KeyValue Entries = 2;
}


// Put or Append
message PutAppendArgs  {
  bytes Key = 1;
  bytes  Value = 2 ;
  bytes  Op = 3;
  // "Put" or "Append"
  // You'll have to add definitions here.
  // Field names must start with capital letters,
  // otherwise RPC will break.
  bytes  ClientId = 4;
  int32  RequestId = 5;
}

message PutAppendReply  {
  bytes Err = 1;
}

message TxnGetArgs {
  bytes Key = 1;
  uint64 ReadTs = 2;
  bytes ClientId = 3;
  int32 RequestId = 4;
}

message TxnGetReply {
  bytes Err = 1;
  bytes Value = 2;
}

message TxnPrewriteArgs {
  bytes Key = 1;
  bytes Value = 2;
  bytes PrimaryKey = 3;
  uint64 StartTs = 4;
  uint64 TtlMs = 5;
  bool IsDelete = 6;
  bytes ClientId = 7;
  int32 RequestId = 8;
}

message TxnPrewriteReply {
  bytes Err = 1;
}

message TxnCommitArgs {
  bytes Key = 1;
  uint64 StartTs = 2;
  uint64 CommitTs = 3;
  bytes ClientId = 4;
  int32 RequestId = 5;
}

message TxnCommitReply {
  bytes Err = 1;
}

message TxnRollbackArgs {
  bytes Key = 1;
  uint64 StartTs = 2;
  bytes ClientId = 3;
  int32 RequestId = 4;
}

message TxnRollbackReply {
  bytes Err = 1;
}

message TxnGetLockArgs {
  bytes Key = 1;
}

message TxnGetLockReply {
  bytes Err = 1;
  bool HasLock = 2;
  bytes PrimaryKey = 3;
  bytes Value = 4;
  uint64 StartTs = 5;
  uint64 TtlMs = 6;
  uint64 CreateTimeMs = 7;
  bool IsDelete = 8;
  bool IsPessimistic = 9;
}

message TxnAcquirePessimisticLockArgs {
  bytes Key = 1;
  bytes PrimaryKey = 2;
  uint64 StartTs = 3;
  uint64 TtlMs = 4;
  bytes ClientId = 5;
  int32 RequestId = 6;
}

message TxnAcquirePessimisticLockReply {
  bytes Err = 1;
}

message TxnFindCommitTsArgs {
  bytes Key = 1;
  uint64 StartTs = 2;
}

message TxnFindCommitTsReply {
  bytes Err = 1;
  bool Found = 2;
  uint64 CommitTs = 3;
}

message TxnExpiredLocksArgs {
  uint64 NowMs = 1;
}

message TxnExpiredLocksReply {
  bytes Err = 1;
  repeated bytes Keys = 2;
  repeated TxnGetLockReply Locks = 3;
}

message TxnGarbageCollectArgs {
  uint64 SafePointTs = 1;
  bytes ClientId = 2;
  int32 RequestId = 3;
}

message TxnGarbageCollectReply {
  bytes Err = 1;
  uint64 RemovedCount = 2;
}

message TxnMaxObservedTsArgs {}

message TxnMaxObservedTsReply {
  bytes Err = 1;
  uint64 MaxTs = 2;
}

//只有raft节点之间才会涉及rpc通信
service kvServerRpc
{
  rpc PutAppend(PutAppendArgs) returns(PutAppendReply);
  rpc Get (GetArgs) returns (GetReply);
  rpc List(ListArgs) returns(ListReply);

  rpc TxnGet(TxnGetArgs) returns (TxnGetReply);
  rpc TxnPrewrite(TxnPrewriteArgs) returns (TxnPrewriteReply);
  rpc TxnCommit(TxnCommitArgs) returns (TxnCommitReply);
  rpc TxnRollback(TxnRollbackArgs) returns (TxnRollbackReply);
  rpc TxnGetLock(TxnGetLockArgs) returns (TxnGetLockReply);
  rpc TxnAcquirePessimisticLock(TxnAcquirePessimisticLockArgs) returns (TxnAcquirePessimisticLockReply);
  rpc TxnFindCommitTs(TxnFindCommitTsArgs) returns (TxnFindCommitTsReply);
  rpc TxnExpiredLocks(TxnExpiredLocksArgs) returns (TxnExpiredLocksReply);
  rpc TxnGarbageCollect(TxnGarbageCollectArgs) returns (TxnGarbageCollectReply);
  rpc TxnMaxObservedTs(TxnMaxObservedTsArgs) returns (TxnMaxObservedTsReply);
}
