syntax = "proto3";

package tsoRpcProtocol;

option cc_generic_services = true;

message TimestampRequest {}

message TimestampReply {
  uint64 Timestamp = 1;
  bytes Err = 2;
  bool NotLeader = 3;
}

message ObserveTimestampRequest {
  uint64 Timestamp = 1;
}

message ObserveTimestampReply {
  bytes Err = 1;
  bool NotLeader = 2;
}

message TimestampStatusRequest {}

message TimestampStatusReply {
  int32 NodeId = 1;
  int32 Term = 2;
  bool IsLeader = 3;
  uint64 HighWater = 4;
  uint32 ProtocolVersion = 5;
  bool HybridLogical = 6;
  uint64 RangeProposalCount = 7;
  uint64 RangeReservationCount = 8;
  uint64 TimestampAllocationCount = 9;
  uint64 RangeSize = 10;
  uint64 NextTimestamp = 11;
  uint64 ActiveRangeHighWater = 12;
  bool FenceValid = 13;
  double AverageTimestampsPerReservation = 14;
}

service timestampOracleRpc {
  rpc Next(TimestampRequest) returns (TimestampReply);
  rpc Peek(TimestampRequest) returns (TimestampReply);
  rpc Observe(ObserveTimestampRequest) returns (ObserveTimestampReply);
  rpc Status(TimestampStatusRequest) returns (TimestampStatusReply);
}
